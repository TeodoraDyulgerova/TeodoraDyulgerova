<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" width="1200" height="120" role="img" aria-label="footer">
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#72C0D7"/>
      <stop offset="50%" stop-color="#7761A9"/>
      <stop offset="100%" stop-color="#130F3A"/>
    </linearGradient>
    <filter id="fsoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

  <rect width="1200" height="120" fill="url(#fsky)"/>

  <g fill="#DEDEDD" filter="url(#fsoft)">
    <circle cx="120"  cy="35" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="240"  cy="70" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="360"  cy="45" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="480"  cy="85" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="600"  cy="30" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="720"  cy="75" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="840"  cy="40" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="960"  cy="80" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="50" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="0.7s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <line x1="0" y1="0" x2="45" y2="12" stroke="#DEDEDD" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="2s" repeatCount="indefinite"/>
    </line>
    <animateTransform attributeName="transform" type="translate"
      values="-60,-20; 800,90" dur="5s" begin="2s" repeatCount="indefinite"/>
  </g>
</svg>
