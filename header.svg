<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" width="1200" height="300" role="img" aria-label="Teodora Dyulgerova - Welcome to My GitHub Universe">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130F3A"/>
      <stop offset="55%" stop-color="#25336E"/>
      <stop offset="100%" stop-color="#7761A9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#72C0D7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#72C0D7" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#sky)"/>
  <ellipse cx="600" cy="150" rx="520" ry="150" fill="url(#glow)"/>

  <!-- twinkling stars -->
  <g fill="#DEDEDD" filter="url(#soft)">
    <circle cx="90"   cy="60"  r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="170"  cy="120" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="250"  cy="45"  r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.0s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="330"  cy="200" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="420"  cy="90"  r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" begin="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="500"  cy="240" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="560"  cy="50"  r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="640"  cy="210" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="720"  cy="70"  r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="800"  cy="230" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.3s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="880"  cy="110" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="960"  cy="55"  r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="190" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="90"  r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="220" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="140"  cy="250" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="380"  cy="140" r="1.0"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="680"  cy="130" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" begin="0.1s" repeatCount="indefinite"/></circle>
    <circle cx="1000" cy="150" r="1.1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" begin="1.7s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shooting star -->
  <g>
    <line x1="0" y1="0" x2="60" y2="18" stroke="#72C0D7" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;1;0" dur="5s" begin="1s" repeatCount="indefinite"/>
    </line>
    <animateTransform attributeName="transform" type="translate"
      values="-80,-30; 700,180" dur="5s" begin="1s" repeatCount="indefinite"/>
  </g>
  <g>
    <line x1="0" y1="0" x2="50" y2="14" stroke="#DEDEDD" stroke-width="1.5" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" begin="3.5s" repeatCount="indefinite"/>
    </line>
    <animateTransform attributeName="transform" type="translate"
      values="200,-40; 1000,200" dur="6s" begin="3.5s" repeatCount="indefinite"/>
  </g>

  <!-- text -->
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" fill="#ffffff" letter-spacing="1">
    Teodora Dyulgerova
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="0s" fill="freeze"/>
  </text>
  <text x="600" y="192" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="18" fill="#72C0D7" letter-spacing="3">
    WELCOME TO MY GITHUB UNIVERSE
    <animate attributeName="opacity" values="0;0.9" dur="1.8s" begin="0.4s" fill="freeze"/>
  </text>
</svg>
